<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#dfe3e7",
              "on-error-container": "#93000a",
              "on-surface": "#171c1f",
              "on-secondary-fixed": "#011d35",
              "on-surface-variant": "#4e4632",
              "surface-tint": "#745b00",
              "on-background": "#171c1f",
              "surface-bright": "#f6fafe",
              "on-secondary": "#ffffff",
              "primary": "#745b00",
              "surface-dim": "#d6dade",
              "surface-container": "#eaeef2",
              "on-primary-fixed-variant": "#584400",
              "secondary-fixed": "#d1e4ff",
              "surface-container-highest": "#dfe3e7",
              "on-tertiary-container": "#00682d",
              "error": "#ba1a1a",
              "tertiary-container": "#4cee7d",
              "inverse-on-surface": "#edf1f5",
              "on-tertiary-fixed-variant": "#005322",
              "secondary": "#49607c",
              "on-primary-fixed": "#241a00",
              "tertiary-fixed": "#66ff8e",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#ffe08b",
              "on-tertiary-fixed": "#002109",
              "tertiary": "#006d2f",
              "inverse-primary": "#f1c100",
              "on-primary-container": "#6f5700",
              "on-tertiary": "#ffffff",
              "secondary-container": "#c7dfff",
              "background": "#f6fafe",
              "surface": "#f6fafe",
              "outline-variant": "#d2c5ab",
              "on-error": "#ffffff",
              "on-secondary-container": "#4b637e",
              "inverse-surface": "#2c3134",
              "surface-container-low": "#f0f4f8",
              "on-primary": "#ffffff",
              "secondary-fixed-dim": "#b0c9e8",
              "error-container": "#ffdad6",
              "surface-container-high": "#e4e9ed",
              "primary-fixed-dim": "#f1c100",
              "on-secondary-fixed-variant": "#314863",
              "tertiary-fixed-dim": "#3de273",
              "outline": "#80765f",
              "primary-container": "#ffcc00"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .scrim-overlay {
            background-color: rgba(23, 28, 31, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Dashboard Background (Mockup for context) -->
<div class="min-h-screen pb-24">
<header class="fixed top-0 w-full z-50 bg-[#f6fafe]/80 backdrop-blur-xl shadow-sm flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container">
<img class="w-full h-full object-cover" data-alt="professional male portrait with soft lighting and neutral background for user profile avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAg92ZkzGVs_fhCJyeAtiBhm723ksZ_VhVxaPgrqAzjwrHGHGJvd07LwQbhpOyWQlLbhPeo4PXcxsKryf8ZKTUtx1uHiVzyPunkEl6dQk5TKmvRCBbH8D3WPb_jQj_rZuRBr_xPw8fe8qQ1I9cqZxBIc2hnO7El533LrPVHps4SA7zeLWgb7LrZcE9hdYiubIrpNPO5JfhQBOi9JS220I7-eBbw98Ze1DLCxd1vzCWvI_FxgJoU5OM3LvsQ2pOQ3-oa2gcOLXPN8eQ"/>
</div>
<div class="font-headline font-bold tracking-tight text-[#49607c] text-xl">The Ledger</div>
</div>
<span class="material-symbols-outlined text-[#49607c]" data-icon="group">group</span>
</header>
<main class="pt-24 px-6 space-y-8">
<section>
<p class="text-secondary font-medium font-label uppercase tracking-widest text-[10px] mb-1">Total Family Savings</p>
<h1 class="font-headline font-extrabold text-4xl tracking-tight text-on-surface">₦4,200,500.00</h1>
</section>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm space-y-4">
<div class="flex justify-between items-center">
<span class="material-symbols-outlined text-primary" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-tertiary font-bold text-sm">+2.4%</span>
</div>
<div>
<p class="text-on-surface-variant text-sm font-label">Operational Treasury</p>
<p class="text-2xl font-headline font-bold text-on-surface">₦1,250,000</p>
</div>
</div>
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm space-y-4">
<div class="flex justify-between items-center">
<span class="material-symbols-outlined text-secondary" data-icon="savings">savings</span>
<span class="text-tertiary font-bold text-sm">+5.1%</span>
</div>
<div>
<p class="text-on-surface-variant text-sm font-label">Education Fund</p>
<p class="text-2xl font-headline font-bold text-on-surface">₦2,950,500</p>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full h-[72px] z-40 bg-white/80 backdrop-blur-xl shadow-[0_-4px_20px_rgba(23,28,31,0.04)] flex justify-around items-center px-4 pb-safe rounded-t-2xl">
<div class="flex flex-col items-center justify-center bg-[#FFCC00]/20 text-[#745b00] rounded-xl px-3 py-1">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-[10px] font-medium uppercase tracking-wider">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#49607c] opacity-70">
<span class="material-symbols-outlined" data-icon="family_restroom">family_restroom</span>
<span class="font-label text-[10px] font-medium uppercase tracking-wider">Family</span>
</div>
<div class="flex flex-col items-center justify-center text-[#49607c] opacity-70">
<span class="material-symbols-outlined" data-icon="shield_with_heart">shield_with_heart</span>
<span class="font-label text-[10px] font-medium uppercase tracking-wider">Steward</span>
</div>
<div class="flex flex-col items-center justify-center text-[#49607c] opacity-70">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
<span class="font-label text-[10px] font-medium uppercase tracking-wider">Treasury</span>
</div>
<div class="flex flex-col items-center justify-center text-[#49607c] opacity-70">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="font-label text-[10px] font-medium uppercase tracking-wider">More</span>
</div>
</nav>
</div>
<!-- Modal Scrim/Overlay -->
<div class="fixed inset-0 z-[60] scrim-overlay flex items-end">
<!-- Bottom Sheet Modal -->
<div class="w-full bg-surface-bright rounded-t-[2rem] shadow-[0_-10px_40px_rgba(23,28,31,0.15)] flex flex-col max-h-[795px]">
<!-- Handle -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-8 pb-6 flex justify-between items-center">
<h2 class="font-headline font-extrabold text-2xl tracking-tight text-on-surface">Select Family</h2>
<button class="p-2 bg-surface-container rounded-full text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
</button>
</div>
<!-- Family List -->
<div class="px-8 space-y-4 pb-8 overflow-y-auto">
<!-- Active Family Item -->
<button class="w-full text-left group transition-all duration-200 active:scale-[0.98]">
<div class="relative p-5 rounded-2xl bg-primary-container border-2 border-primary transition-colors flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-on-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-2xl" data-icon="family_history" style="font-variation-settings: 'FILL' 1;">family_history</span>
</div>
<div class="flex-1">
<div class="flex items-center gap-2">
<h3 class="font-headline font-bold text-on-primary-container">Abara Family</h3>
<div class="bg-primary/10 px-2 py-0.5 rounded-full">
<span class="text-[10px] font-bold text-primary uppercase tracking-tighter">Active</span>
</div>
</div>
<p class="text-sm font-label text-on-primary-container/80">4 Members • ₦4.2M Treasury</p>
</div>
<span class="material-symbols-outlined text-primary text-2xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Inactive Family Item -->
<button class="w-full text-left group transition-all duration-200 active:scale-[0.98]">
<div class="p-5 rounded-2xl bg-surface-container-low hover:bg-surface-container-high border-2 border-transparent transition-colors flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-secondary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="family_history">family_history</span>
</div>
<div class="flex-1">
<h3 class="font-headline font-bold text-on-surface">Benson Family</h3>
<p class="text-sm font-label text-on-surface-variant">3 Members • ₦1.8M Treasury</p>
</div>
<span class="material-symbols-outlined text-surface-variant group-hover:text-on-surface-variant transition-colors" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Divider Alternative (Space as Luxury) -->
<div class="pt-4"></div>
<!-- Action Button -->
<button class="w-full py-4 px-6 rounded-xl bg-secondary-container hover:bg-[#b0c9e8] transition-colors flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="add_circle">add_circle</span>
<span class="font-label font-semibold text-on-secondary-container text-sm">+ Create New Family</span>
</button>
</div>
<!-- Footer Spacing for Safe Areas -->
<div class="h-10"></div>
</div>
</div>
</body></html>
