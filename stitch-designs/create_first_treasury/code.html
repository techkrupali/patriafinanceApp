<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patria - Create First Treasury</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed": "#d1e4ff",
                        "inverse-surface": "#2c3134",
                        "primary": "#745b00",
                        "on-secondary-fixed": "#011d35",
                        "tertiary-fixed-dim": "#3de273",
                        "secondary": "#49607c",
                        "on-secondary-container": "#4b637e",
                        "surface-container-high": "#e4e9ed",
                        "on-primary-fixed": "#241a00",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#314863",
                        "surface-container-low": "#f0f4f8",
                        "on-tertiary-container": "#00682d",
                        "on-primary-fixed-variant": "#584400",
                        "on-surface": "#171c1f",
                        "primary-fixed": "#ffe08b",
                        "on-primary-container": "#6f5700",
                        "tertiary-container": "#4cee7d",
                        "surface": "#f6fafe",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#006d2f",
                        "surface-variant": "#dfe3e7",
                        "outline-variant": "#d2c5ab",
                        "on-tertiary-fixed-variant": "#005322",
                        "tertiary-fixed": "#66ff8e",
                        "surface-container-highest": "#dfe3e7",
                        "inverse-primary": "#f1c100",
                        "surface-tint": "#745b00",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d6dade",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#c7dfff",

                        "secondary-fixed-dim": "#b0c9e8",

                        "primary-fixed-dim": "#f1c100",
                        "on-error": "#ffffff",
                        "background": "#f6fafe",
                        "surface-container": "#eaeef2",
                        "on-tertiary-fixed": "#002109",
                        "outline": "#80765f"

                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-headline {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-14 z-50 bg-[#f6fafe]/80 backdrop-blur-xl flex items-center px-4">
<div class="flex items-center w-full">
<button class="p-2 -ml-2 hover:bg-[#f0f4f8]/50 active:scale-95 transition-all duration-200 rounded-full">
<span class="material-symbols-outlined text-[#745b00] block">arrow_back</span>
</button>
<h1 class="ml-2 font-headline font-bold text-lg tracking-tight text-[#171c1f]">Create Treasury</h1>
</div>
</header>
<main class="w-full max-w-md px-6 pt-20 pb-32 flex flex-col gap-8">
<!-- Progress Indicator -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<span class="text-xs font-semibold text-secondary tracking-wider uppercase">Onboarding</span>
<span class="text-xs font-bold text-primary">Step 5 of 8</span>
</div>
<div class="h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[62.5%] transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Title Section -->
<div class="space-y-2">
<h2 class="font-headline font-extrabold text-3xl text-on-surface leading-tight">Create Your First Treasury</h2>
<p class="text-secondary font-medium leading-relaxed">This is where your money will be stored and managed.</p>
</div>
<!-- Identity Block -->
<div class="bg-surface-container-low rounded-2xl p-6 space-y-6">
<!-- Treasury Name Input -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-1">Treasury Name</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 px-4 text-on-surface font-semibold focus:ring-2 focus:ring-primary transition-all duration-200 shadow-sm" placeholder="Enter treasury name" type="text" value="Main Treasury"/>
</div>
</div>
<!-- Treasury Purpose Selection -->
<div class="space-y-3">
<label class="block text-sm font-bold text-on-surface-variant ml-1">Treasury Purpose</label>
<div class="flex flex-wrap gap-2">
<!-- Chips -->
<button class="px-4 py-2 rounded-full text-sm font-bold bg-primary-container text-on-primary-container border border-primary/10 shadow-sm transition-transform active:scale-95">General Use</button>
<button class="px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-secondary hover:bg-surface-container-high transition-colors active:scale-95">Savings</button>
<button class="px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-secondary hover:bg-surface-container-high transition-colors active:scale-95">Family Expenses</button>
<button class="px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-secondary hover:bg-surface-container-high transition-colors active:scale-95">Project</button>
<button class="px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-secondary hover:bg-surface-container-high transition-colors active:scale-95">Emergency</button>
</div>
</div>
</div>
<!-- Funding Section -->
<div class="space-y-4">
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-1">Add Initial Amount (Optional)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-on-surface font-bold text-lg">₦</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-10 pr-4 text-on-surface font-headline font-bold text-xl focus:ring-2 focus:ring-primary transition-all duration-200" placeholder="0.00" type="number"/>
</div>
<p class="text-xs font-medium text-secondary italic ml-1">You can fund this later</p>
</div>
</div>
<!-- Visual Reinforcement / Tip -->
<div class="flex items-start gap-3 p-4 bg-tertiary-container/10 rounded-xl border border-tertiary/10">
<div class="flex-shrink-0 mt-0.5">
<span class="material-symbols-outlined text-tertiary text-lg" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<p class="text-xs font-medium text-on-tertiary-fixed-variant leading-relaxed">
                You can create multiple treasuries later for different goals, such as vacation, school fees, or home maintenance.
            </p>
</div>
</main>
<!-- Fixed CTA Button Container -->
<div class="fixed bottom-0 w-full max-w-md p-6 bg-surface/80 backdrop-blur-md">
<button class="w-full bg-primary-container text-on-primary-container font-headline font-extrabold py-4 rounded-xl shadow-[0_8px_24px_rgba(116,91,0,0.15)] hover:shadow-lg active:scale-[0.98] transition-all duration-200 text-lg uppercase tracking-wider">
            Create Treasury
        </button>
</div>
</body></html>
