<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Biometric Setup - Security</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

              "surface": "#f6fafe",
              "primary": "#745b00",
              "inverse-surface": "#2c3134",
              "surface-container-high": "#e4e9ed",

              "primary-container": "#ffcc00",

              "on-tertiary-fixed-variant": "#005322",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .biometric-glow {
            background: radial-gradient(circle, rgba(76, 238, 125, 0.15) 0%, rgba(246, 250, 254, 0) 70%);
        }
        body {
            background-color: #F9FAFB; /* User requested Milk White background */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky flex items-center h-14 px-4 w-full bg-[#f6fafe] dark:bg-slate-950 z-50">
<div class="flex items-center w-full justify-between">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors active:scale-95 duration-200 text-[#745b00] dark:text-[#ffcc00]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-[#171c1f] dark:text-white">Security Setup</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-6 pb-12 items-center justify-center max-w-md mx-auto w-full">
<!-- Hero Section -->
<section class="flex flex-col items-center text-center mt-4 mb-auto">
<!-- Biometric Icon Container -->
<div class="relative w-48 h-48 flex items-center justify-center mb-10">
<!-- Ambient Glow Decoration -->
<div class="absolute inset-0 biometric-glow animate-pulse"></div>
<!-- Primary Icon Circle -->
<div class="relative w-32 h-32 rounded-full bg-secondary-container flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-secondary text-6xl" data-icon="fingerprint">fingerprint</span>
</div>
<!-- Secondary Floating Icon -->
<div class="absolute top-4 right-4 w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-tertiary-container text-2xl" data-icon="face">face</span>
</div>
</div>
<!-- Typography -->
<h2 class="font-headline font-extrabold text-3xl text-on-secondary-fixed mb-4 leading-tight">
                Secure Your Account Faster
            </h2>
<p class="font-body text-secondary text-base leading-relaxed max-w-[280px]">
                Use Face ID or Fingerprint to log in instantly and approve sensitive actions.
            </p>
</section>
<!-- Thumb Zone Actions -->
<section class="w-full space-y-4 mt-12">
<!-- Primary Action -->
<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline font-bold text-base rounded-xl flex items-center justify-center shadow-sm hover:brightness-105 active:scale-[0.98] transition-all duration-200">
                Enable Biometric Login
            </button>
<!-- Secondary Action -->
<button class="w-full py-3 text-secondary font-label font-semibold text-sm hover:text-on-surface transition-colors active:opacity-70">
                Skip for now
            </button>
</section>
<!-- Footer Info -->
<footer class="mt-8 text-center">
<p class="text-outline text-xs font-medium tracking-wide">
                You can change this later in Settings
            </p>
</footer>
</main>
<!-- Visual Polish: Ledger Texture (Decorative bottom background gradient) -->
<div class="fixed bottom-0 left-0 right-0 h-32 pointer-events-none bg-gradient-to-t from-surface-container-low/40 to-transparent z-[-1]"></div>
</body></html>
